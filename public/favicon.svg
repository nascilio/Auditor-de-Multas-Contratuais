<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="18" y1="16" x2="46" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>
  <!-- Rounded App Icon Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="2" />
  
  <!-- Calculator Body -->

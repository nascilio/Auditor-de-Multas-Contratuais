  <!-- Calculator Buttons Grid -->
  <circle cx="24" cy="32" r="2.2" fill="#93C5FD" />
  <circle cx="32" cy="32" r="2.2" fill="#93C5FD" />
  <circle cx="40" cy="32" r="2.2" fill="#38BDF8" />
  
  <circle cx="24" cy="39" r="2.2" fill="#93C5FD" />
  <circle cx="32" cy="39" r="2.2" fill="#93C5FD" />
  <circle cx="40" cy="39" r="2.2" fill="#38BDF8" />
  
  <circle cx="24" cy="46" r="2.2" fill="#93C5FD" />
  <rect x="30" y="43.8" width="12" height="4.4" rx="2.2" fill="#2563EB" />
</svg>
